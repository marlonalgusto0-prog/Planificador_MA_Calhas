<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 id="app-title">Boca de Lobo</h1>
            <nav class="tabs">
                <button onclick="switchTab('curva')">Curva</button>
                <button onclick="switchTab('cotovelo')">Cotovelo</button>
                <button onclick="switchTab('boca')" class="active">Boca de Lobo</button>
            </nav>
        </header>

        <main>
            <div class="input-grid">
                <div class="input-group">
                    <label>D (Tubo Principal)</label>
                    <input type="number" id="diam_D" placeholder="D">
                </div>
                <div class="input-group" id="branch-pipe">
                    <label>d (Tubo Ramal)</label>
                    <input type="number" id="diam_d" placeholder="d">
                </div>
                <div class="input-group">
                    <label>h (Altura)</label>
                    <input type="number" id="altura" placeholder="h">
                </div>
                <div class="input-group">
                    <label>E (Espessura)</label>
                    <input type="number" id="espessura" placeholder="E">
                </div>
            </div>

            <button class="btn-calculate" onclick="calcular()">CALCULAR</button>

            <div id="result-container" class="result-container" style="display: none;">
                <h3>Planificação</h3>
                <div id="svg-area" class="svg-area">
                    </div>
                <div id="numerical-results" class="numerical-grid">
                    </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
