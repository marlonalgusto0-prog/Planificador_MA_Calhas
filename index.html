<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="home-screen" class="container">
        <header>
            <h1>Planificador</h1>
        </header>

        <section class="category">
            <h2>Gratuitos</h2>
            <div class="grid">
                <div class="card" onclick="openCalc('boca')">
                    <div class="icon-box"><img src="https://img.icons8.com/fluency/96/pipe.png" alt="Boca de Lobo"></div>
                    <span>Boca de Lobo</span>
                </div>
                <div class="card" onclick="openCalc('flange')">
                    <div class="icon-box"><img src="https://img.icons8.com/fluency/96/gear.png" alt="Flange"></div>
                    <span>Furação de Flange</span>
                </div>
            </div>
        </section>

        <section class="category">
            <h2>Curvas</h2>
            <div class="grid">
                <div class="card" onclick="openCalc('curva')">
                    <div class="icon-box"><img src="https://img.icons8.com/fluency/96/plumbing.png" alt="Curva de Gomos"></div>
                    <span>Curva de Gomos</span>
                </div>
                <div class="card" onclick="openCalc('cotovelo')">
                    <div class="icon-box"><img src="https://img.icons8.com/fluency/96/pipeline.png" alt="Cotovelo"></div>
                    <span>Cotovelo</span>
                </div>
            </div>
        </section>
    </div>

    <div id="calc-screen" class="container" style="display:none;">
        <div class="nav-back">
            <button onclick="goBack()">← Voltar</button>
            <h2 id="calc-title">Boca de Lobo</h2>
        </div>

        <div class="diagram-area" id="diagram-view">
            </div>

        <div class="input-grid" id="inputs-container">
            </div>

        <button class="btn-main" onclick="processarCalculo()">CALCULAR</button>

        <div id="result-area" class="result-area"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
