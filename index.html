<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Caldeiraria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-mode="curva">
    <div class="app-container">
        <header>
            <nav class="tabs">
                <button onclick="switchTab('curva')" id="btn-curva" class="active">Curva</button>
                <button onclick="switchTab('cotovelo')" id="btn-cotovelo">Cotovelo</button>
                <button onclick="switchTab('boca')" id="btn-boca">Boca de Lobo</button>
            </nav>
            <h1 id="app-title">Curva de Gomos</h1>
        </header>

        <main>
            <div class="diagram-container" id="main-diagram">
                </div>

            <div class="input-grid">
                <div class="input-group">
                    <label>D (Diâm. Maior)</label>
                    <input type="number" id="val-D" placeholder="0.00">
                </div>
                <div class="input-group" id="group-d">
                    <label>d (Diâm. Menor)</label>
                    <input type="number" id="val-d" placeholder="0.00">
                </div>
                <div class="input-group" id="group-R">
                    <label>R (Raio Curva)</label>
                    <input type="number" id="val-R" placeholder="0.00">
                </div>
                <div class="input-group" id="group-h">
                    <label>h (Altura)</label>
                    <input type="number" id="val-h" placeholder="0.00">
                </div>
                <div class="input-group" id="group-a">
                    <label>α (Ângulo)</label>
                    <input type="number" id="val-a" placeholder="0°">
                </div>
                <div class="input-group">
                    <label>E (Espessura)</label>
                    <input type="number" id="val-E" placeholder="0.00">
                </div>
                <div class="input-group" id="group-gomos">
                    <label>Nº de Gomos</label>
                    <input type="number" id="val-gomos" placeholder="Qtd">
                </div>
                <div class="input-group">
                    <label>Nº Divisões</label>
                    <input type="number" id="val-div" value="12">
                </div>
            </div>

            <button class="btn-calculate" onclick="calcular()">CALCULAR</button>

            <div id="result-section" style="display: none;">
                <hr>
                <h3>Planificação</h3>
                <div id="plan-visual" class="plan-svg"></div>
                <div id="results-table" class="results-grid"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
