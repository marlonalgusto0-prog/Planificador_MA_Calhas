<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Caldeiraria Pro</title>
    <style>
        :root { --primary: #2196F3; --bg: #f5f5f5; --dark: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        
        /* Abas */
        .tabs { display: flex; overflow-x: auto; margin-bottom: 20px; border-bottom: 2px solid #ddd; gap: 10px; }
        .tab { padding: 12px 20px; cursor: pointer; border: none; background: none; font-weight: bold; color: #666; white-space: nowrap; }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        /* Formulário */
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .input-field { display: flex; flex-direction: column; }
        label { font-size: 14px; color: #555; font-weight: 600; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-top: 5px; outline-color: var(--primary); }
        
        .btn-calc { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-calc:hover { background: #1976D2; }

        /* Área de Resultado e Desenho */
        .result-section { margin-top: 25px; display: none; border-top: 2px solid #eee; padding-top: 20px; }
        .canvas-container { width: 100%; background: #fff; border: 1px solid #ddd; border-radius: 8px; margin: 15px 0; overflow: hidden; }
        canvas { width: 100%; height: auto; display: block; }
        
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f9f9f9; padding: 15px; border-radius: 8px; font-family: monospace; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab active" onclick="switchTab('gomos', this)">Curva de Gomos</button>
        <button class="tab" onclick="switchTab('cotovelo', this)">Cotovelo</button>
        <button class="tab" onclick="switchTab('boca', this)">Boca de Lobo</button>
    </div>

    <div id="inputs-container">
        <div id="fields" class="input-group">
            </div>
    </div>

    <button class="btn-calc" onclick="processarCalculo()">CALCULAR</button>

    <div id="result-section" class="result-section">
        <center><h3 id="res-title">Planificação</h3></center>
        
        <div class="canvas-container">
            <canvas id="plan-canvas" width="600" height="200"></canvas>
        </div>

        <div id="ordenadas-values" class="data-grid">
            </div>
    </div>
</div>

<script>
    let currentType = 'gomos';
    const canvas = document.getElementById('plan-canvas');
    const ctx = canvas.getContext('2d');

    // Configuração inicial dos campos
    const schemas = {
        gomos: ['D', 'R', 'α', 'E', 'Nº Gomos', 'Divisões'],
        cotovelo: ['D', 'h', 'α', 'E', 'Divisões'],
        boca: ['D (Tronco)', 'd (Ramal)', 'h', 'E', 'Divisões']
    };

    function switchTab(type, el) {
        currentType = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderInputs();
        document.getElementById('result-section').style.display = 'none';
    }

    function renderInputs() {
        const container = document.getElementById('fields');
        container.innerHTML = '';
        schemas[currentType].forEach(label => {
            const div = document.createElement('div');
            div.className = 'input-field';
            const id = label.split(' ')[0].toLowerCase();
            div.innerHTML = `<label>${label}</label><input type="number" id="val-${id}" value="${id === 'divisões' ? 12 : ''}">`;
            container.appendChild(div);
        });
    }

    function processarCalculo() {
        document.getElementById('result-section').style.display = 'block';
        desenharPlanificacao();
        gerarValores();
    }

    function desenharPlanificacao() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 2;
        ctx.beginPath();

        // Desenho ilustrativo da curva senoidal da planificação
        ctx.moveTo(50, 150);
        for (let x = 0; x <= 500; x++) {
            let y = 100 + Math.sin(x * 0.05) * 30; // Simula a curva de corte
            ctx.lineTo(50 + x, y);
        }
        ctx.lineTo(550, 150);
        ctx.lineTo(50, 150);
        ctx.stroke();

        // Linhas das divisões (geratrizes)
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1;
        for(let i=0; i<=12; i++) {
            let x = 50 + (i * (500/12));
            ctx.beginPath();
            ctx.moveTo(x, 150);
            ctx.lineTo(x, 100 + Math.sin((i * (500/12)) * 0.05) * 30);
            ctx.stroke();
        }
        ctx.setLineDash([]);
    }

    function gerarValores() {
        const grid = document.getElementById('ordenadas-values');
        const div = parseInt(document.getElementById('val-divisões').value) || 12;
        
        // Simulação de cálculo de ordenadas baseado no diâmetro
        let html = `<div><strong>P (Perímetro) =</strong> 314.16</div>`;
        html += `<div><strong>A (Divisão) =</strong> ${(314.16/div).toFixed(2)}</div>`;
        
        for(let i=1; i<=(div/2 + 1); i++) {
            html += `<div><strong>${i} =</strong> ${(100 + Math.random()*20).toFixed(2)}</div>`;
        }
        
        grid.innerHTML = html;
    }

    // Inicializar
    renderInputs();
</script>

</body>
</html>
